name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Baixar o modelo da release
        run: |
          curl -L -o app/src/main/assets/yolo11s.tflite \
            https://github.com/ricardochiesa86/AlertaTTC/releases/download/modelo-v1/yolo11s.tflite
          ls -la app/src/main/assets/

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Gerar o wrapper que falta
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar o APK de debug (limpo, sem cache)
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Publicar o APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: AlertaTTC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
